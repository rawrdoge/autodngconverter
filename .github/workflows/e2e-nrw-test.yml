name: E2E Test with NRW Fixtures

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main", "pr/hex-v2" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-postgresql-dnglab:
    name: E2E (PostgreSQL + dnglab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rawimport
          POSTGRES_USER: rawimport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rawimport -d rawimport"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libpq-dev libssl-dev libspdlog-dev exiftool

      - name: Download dnglab binary
        run: |
          mkdir -p tools
          curl -fsSL -L -o tools/dnglab \
            "https://github.com/dnglab/dnglab/releases/download/v0.8.0/dnglab_linux_x64"
          chmod +x tools/dnglab
          echo "${{ github.workspace }}/tools" >> $GITHUB_PATH

      - name: Verify dnglab
        run: |
          dnglab --version || dnglab --help

      - name: Test dnglab on sample NRW
        run: |
          dnglab testsuite/DSCN7027.NRW /tmp/test.dng 2>&1 || true
      - name: Check NRW files
        run: |
          ls -la testsuite/*.NRW
          file testsuite/DSCN7027.NRW
          dnglab --version
          dnglab testsuite/DSCN7027.NRW /tmp/test.dng -v 2>&1 || true

      - name: Prepare testsuite fixtures
        run: |
          mkdir -p testsuite
          python3 .github/workflows/create_nrw.py
          ls -la testsuite/*.NRW | wc -l

      - name: Configure (E2E with PostgreSQL + dnglab)
        run: |
          cmake -S . -B build-e2e \
            -DWITH_HEXAGONAL=ON \
            -DWITH_POSTGRESQL=ON \
            -DWITH_DNGLAB=ON \
            -DWITH_EXIFTOOL=ON \
            -DWITH_SPDLOG=ON \
            -DBUILD_TESTING=ON \
            -DBUILD_E2E_TESTS=ON

      - name: Build
        run: cmake --build build-e2e -j4

      - name: Run E2E tests
        env:
          E2E_DB_DRIVER: postgresql
          E2E_DB_CONNECTION: postgresql://rawimport:test@localhost:5432/rawimport
          E2E_CONVERTER_ENGINE: dnglab
          E2E_TESTSUITE_DIR: ${{ github.workspace }}/testsuite
        run: |
          ctest --test-dir build-e2e --output-on-failure -R e2e_nrw

  e2e-mariadb-dnglab:
    name: E2E (MariaDB + dnglab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: rawimport
          MARIADB_USER: rawimport
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping --socket=/run/mysqld/mysqld.sock -u root -ptest"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libmariadb-dev libssl-dev libspdlog-dev exiftool

      - name: Download dnglab binary
        run: |
          mkdir -p tools
          curl -fsSL -L -o tools/dnglab \
            "https://github.com/dnglab/dnglab/releases/download/v0.8.0/dnglab_linux_x64"
          chmod +x tools/dnglab
          echo "${{ github.workspace }}/tools" >> $GITHUB_PATH

      - name: Verify dnglab
        run: |
          dnglab --version || dnglab --help

      - name: Test dnglab on sample NRW
        run: |
          dnglab testsuite/DSCN7027.NRW /tmp/test.dng 2>&1 || true
      - name: Check NRW files
        run: |
          ls -la testsuite/*.NRW
          file testsuite/DSCN7027.NRW
          dnglab --version
          dnglab testsuite/DSCN7027.NRW /tmp/test.dng -v 2>&1 || true

      - name: Prepare testsuite fixtures
        run: |
          mkdir -p testsuite
          python3 .github/workflows/create_nrw.py
          ls -la testsuite/*.NRW | wc -l

      - name: Configure (E2E with MariaDB + dnglab)
        run: |
          cmake -S . -B build-e2e \
            -DWITH_HEXAGONAL=ON \
            -DWITH_MARIADB=ON \
            -DWITH_DNGLAB=ON \
            -DWITH_EXIFTOOL=ON \
            -DWITH_SPDLOG=ON \
            -DBUILD_TESTING=ON \
            -DBUILD_E2E_TESTS=ON

      - name: Build
        run: cmake --build build-e2e -j4

      - name: Run E2E tests
        env:
          E2E_DB_DRIVER: mariadb
          E2E_DB_CONNECTION: "host=127.0.0.1;user=rawimport;password=test;database=rawimport"
          E2E_CONVERTER_ENGINE: dnglab
          E2E_TESTSUITE_DIR: ${{ github.workspace }}/testsuite
        run: |
          ctest --test-dir build-e2e --output-on-failure -R e2e_nrw

