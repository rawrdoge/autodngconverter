name: E2E Test with NRW Fixtures

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main", "pr/hex-v2" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-postgresql-dnglab:
    name: E2E (PostgreSQL + dnglab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rawimport
          POSTGRES_USER: rawimport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rawimport -d rawimport"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libpq-dev libssl-dev libspdlog-dev exiftool

      - name: Download test fixtures
        run: |
          mkdir -p testsuite
          curl -fsSL -o testsuite-nrw-v1.tar.gz \
            "https://github.com/rawrdoge/autodngconverter/releases/download/testsuite-nrw-v1/testsuite-nrw-v1.tar.gz"
          tar -xzf testsuite-nrw-v1.tar.gz -C testsuite
          rm testsuite-nrw-v1.tar.gz
          echo "Test fixtures downloaded: $(ls testsuite/*.NRW | wc -l) NRW files"

      - name: Download dnglab binary
        run: |
          mkdir -p tools
          curl -fsSL -o tools/dnglab \
            "https://github.com/dnglab/dnglab/releases/download/v0.8.0/dnglab_linux_x64"
          chmod +x tools/dnglab
          echo "${{ github.workspace }}/tools" >> $GITHUB_PATH

      - name: Verify dnglab
        run: |
          dnglab --version || dnglab --help

      - name: Prepare testsuite fixtures
        run: |
          mkdir -p testsuite
          # Download a sample NRW file
          curl -fsSL -o testsuite/sample1.NRW "https://filesamples.com/samples/image/nrw/sample1.nrw" || true
          # If download fails or file is empty, create synthetic files with different sizes
          if [ ! -f testsuite/sample1.NRW ] || [ ! -s testsuite/sample1.NRW ]; then
            echo "Download failed, creating synthetic NRW files with different sizes..."
            for i in $(seq 1 20); do
              # Create files with different sizes (100KB + i KB) to ensure different hashes
              dd if=/dev/urandom of="testsuite/DSCN$(printf '%04d' $((7026 + i))).NRW" bs=1K count=$((100 + i)) 2>/dev/null
              # Try to add EXIF metadata to make them more realistic (may fail on random data)
              exiftool -overwrite_original \
                -Artist="Test Artist $i" \
                -ImageDescription="E2E Test Image $i" \
                -UserComment="Test comment $i" \
                "testsuite/DSCN$(printf '%04d' $((7026 + i))).NRW" 2>/dev/null || true
            done
          else
            # Create 20 distinct NRW files by copying and modifying EXIF metadata
            for i in $(seq 1 20); do
              cp testsuite/sample1.NRW "testsuite/DSCN$(printf '%04d' $((7026 + i))).NRW"
              # Modify EXIF metadata to make each file unique (changes hash)
              exiftool -overwrite_original \
                -Artist="Test Artist $i" \
                -ImageDescription="E2E Test Image $i" \
                -UserComment="Test comment $i" \
                "testsuite/DSCN$(printf '%04d' $((7026 + i))).NRW" 2>/dev/null || true
            done
          fi
          ls -la testsuite/*.NRW | wc -l

      - name: Configure (E2E with PostgreSQL + dnglab)
        run: |
          cmake -S . -B build-e2e \
            -DWITH_HEXAGONAL=ON \
            -DWITH_POSTGRESQL=ON \
            -DWITH_DNGLAB=ON \
            -DWITH_EXIFTOOL=ON \
            -DWITH_SPDLOG=ON \
            -DBUILD_TESTING=ON \
            -DBUILD_E2E_TESTS=ON

      - name: Build
        run: cmake --build build-e2e -j4

      - name: Run E2E tests
        env:
          E2E_DB_DRIVER: postgresql
          E2E_DB_CONNECTION: postgresql://rawimport:test@localhost:5432/rawimport
          E2E_CONVERTER_ENGINE: dnglab
          E2E_TESTSUITE_DIR: ${{ github.workspace }}/testsuite
        run: |
          ctest --test-dir build-e2e --output-on-failure -R e2e_nrw

  e2e-mariadb-dnglab:
    name: E2E (MariaDB + dnglab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: rawimport
          MARIADB_USER: rawimport
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping --socket=/run/mysqld/mysqld.sock -u root -ptest"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libmariadb-dev libssl-dev libspdlog-dev exiftool

      - name: Download test fixtures
        run: |
          mkdir -p testsuite
          curl -fsSL -o testsuite-nrw-v1.tar.gz \
            "https://github.com/rawrdoge/autodngconverter/releases/download/testsuite-nrw-v1/testsuite-nrw-v1.tar.gz"
          tar -xzf testsuite-nrw-v1.tar.gz -C testsuite
          rm testsuite-nrw-v1.tar.gz
          echo "Test fixtures downloaded: $(ls testsuite/*.NRW | wc -l) NRW files"

      - name: Download dnglab binary
        run: |
          mkdir -p tools
          curl -fsSL -o tools/dnglab \
            "https://github.com/dnglab/dnglab/releases/download/v0.8.0/dnglab_linux_x64"
          chmod +x tools/dnglab
          echo "${{ github.workspace }}/tools" >> $GITHUB_PATH

      - name: Verify dnglab
        run: |
          dnglab --version || dnglab --help

      - name: Prepare testsuite fixtures
        run: |
          mkdir -p testsuite
          # Download a sample NRW file
          curl -fsSL -o testsuite/sample1.NRW "https://filesamples.com/samples/image/nrw/sample1.nrw" || true
          # If download fails or file is empty, create synthetic files with different sizes
          if [ ! -f testsuite/sample1.NRW ] || [ ! -s testsuite/sample1.NRW ]; then
            echo "Download failed, creating synthetic NRW files with different sizes..."
            for i in $(seq 1 20); do
              # Create files with different sizes (100KB + i KB) to ensure different hashes
              dd if=/dev/urandom of="testsuite/DSCN$(printf '%04d' $((7026 + i))).NRW" bs=1K count=$((100 + i)) 2>/dev/null
              # Try to add EXIF metadata to make them more realistic (may fail on random data)
              exiftool -overwrite_original \
                -Artist="Test Artist $i" \
                -ImageDescription="E2E Test Image $i" \
                -UserComment="Test comment $i" \
                "testsuite/DSCN$(printf '%04d' $((7026 + i))).NRW" 2>/dev/null || true
            done
          else
            # Create 20 distinct NRW files by copying and modifying EXIF metadata
            for i in $(seq 1 20); do
              cp testsuite/sample1.NRW "testsuite/DSCN$(printf '%04d' $((7026 + i))).NRW"
              # Modify EXIF metadata to make each file unique (changes hash)
              exiftool -overwrite_original \
                -Artist="Test Artist $i" \
                -ImageDescription="E2E Test Image $i" \
                -UserComment="Test comment $i" \
                "testsuite/DSCN$(printf '%04d' $((7026 + i))).NRW" 2>/dev/null || true
            done
          fi
          ls -la testsuite/*.NRW | wc -l

      - name: Configure (E2E with MariaDB + dnglab)
        run: |
          cmake -S . -B build-e2e \
            -DWITH_HEXAGONAL=ON \
            -DWITH_MARIADB=ON \
            -DWITH_DNGLAB=ON \
            -DWITH_EXIFTOOL=ON \
            -DWITH_SPDLOG=ON \
            -DBUILD_TESTING=ON \
            -DBUILD_E2E_TESTS=ON

      - name: Build
        run: cmake --build build-e2e -j4

      - name: Run E2E tests
        env:
          E2E_DB_DRIVER: mariadb
          E2E_DB_CONNECTION: mysql://rawimport:test@localhost:3306/rawimport
          E2E_CONVERTER_ENGINE: dnglab
          E2E_TESTSUITE_DIR: ${{ github.workspace }}/testsuite
        run: |
          ctest --test-dir build-e2e --output-on-failure -R e2e_nrw