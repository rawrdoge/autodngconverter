version: "3.8"

services:
  rawimport:
    image: ghcr.io/rawrdoge/autodngconverter:latest
    container_name: rawimport
    restart: unless-stopped
    environment:
      - RAWIMPORT_DB_DRIVER=${RAWIMPORT_DB_DRIVER:-postgresql}
      - RAWIMPORT_DB_CONNECTION=${RAWIMPORT_DB_CONNECTION:-postgresql://rawimport:${DB_PASSWORD}@${DB_HOST:-localhost}:${DB_PORT:-5432}/${DB_NAME:-rawimport}}
      - RAWIMPORT_DB_SSLMODE=${RAWIMPORT_DB_SSLMODE:-disable}
      - RAWIMPORT_WATCH_DIR=/watch
      - RAWIMPORT_OUTPUT_DIR=/output
      - RAWIMPORT_ARCHIVE_DIR=/archive
      - RAWIMPORT_CONVERTER_ENGINE=${RAWIMPORT_CONVERTER_ENGINE:-dnglab}
      - RAWIMPORT_CONVERTER_ENGINE_BIN=${CONVERTER_ENGINE_BIN:-}
      - RAWIMPORT_APPDATA_DIR=/appdata
      - RAWIMPORT_EXIFTOOL_BIN=exiftool
      - RAWIMPORT_FOLDER_SCHEMA=%Y/%m
      - RAWIMPORT_FILE_PATTERN=IMG_{seq}
      - RAWIMPORT_POLL_INTERVAL=10
      - RAWIMPORT_LOG_LEVEL=info
      - RAWIMPORT_PORT=8080
    volumes:
      - /mnt/nas/photos/watch:/watch
      - /mnt/nas/photos/output:/output
      - /mnt/nas/photos/archive:/archive
      # Optional: appdata for custom engines & config
      # - /mnt/nas/photos/appdata:/appdata
    ports:
      - "8080:8080"