version: "3.8"

services:
  rawimport:
    image: ghcr.io/rawrdoge/autodngconverter:latest
    container_name: rawimport
    restart: unless-stopped
    environment:
      - DB_DRIVER=mariadb
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - WATCH_DIR=/watch
      - OUTPUT_DIR=/output
      - ARCHIVE_DIR=/archive
      - CONVERTER_ENGINE=dnglab
      - CONVERTER_ENGINE_BIN=${CONVERTER_ENGINE_BIN:-}
      - APPDATA_DIR=/appdata
      - EXIFTOOL_BIN=exiftool
      - FOLDER_SCHEMA=%Y/%m
      - FILE_PATTERN=IMG_{seq}
      - POLL_INTERVAL=10
      - LOG_LEVEL=info
      - PORT=8080
    volumes:
      - /mnt/nas/photos/watch:/watch
      - /mnt/nas/photos/output:/output
      - /mnt/nas/photos/archive:/archive
      # Optional: appdata for custom engines & config
      # - /mnt/nas/photos/appdata:/appdata
    ports:
      - "8080:8080"